<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DATA SAO Android | Administración</title><style>body{background:#101318;color:#eee;font:16px system-ui;max-width:850px;margin:30px auto;padding:16px}input,select,textarea,button{font:inherit;padding:10px;margin:5px 0;border-radius:8px;border:1px solid #555}input,select,textarea{background:#20252d;color:white;width:100%;box-sizing:border-box}button{cursor:pointer;background:#f4c430;color:#111}section,article{background:#191e25;padding:16px;margin:12px 0;border-radius:12px}label{display:block}input[type=checkbox]{width:auto} [hidden]{display:none!important}</style><h1>DATA SAO / Android</h1><p id="status" role="status"></p><section id="login"><form id="auth"><label>Correo<input name="email" type="email" required></label><label>Contraseña<input name="password" type="password" required></label><button>Ingresar</button></form></section><section id="panel" hidden><button id="logout">Cerrar sesión</button><h2>Catálogo</h2><form id="editor"><input name="id" type="hidden"><label>Tipo<select name="kind"><option value="tv">TV</option><option value="movie">Película</option><option value="series">Serie</option><option value="music">Música</option><option value="premiere">Estreno</option></select></label><label>Título<input name="title" required></label><label>Categoría<input name="category"></label><label>Descripción<textarea name="description"></textarea></label><label>Portada URL<input name="cover_url" type="url"></label><label>Enlace autorizado de reproducción<input name="playback_url" type="url" required></label><label>Orden<input name="sort_order" type="number" value="0"></label><label><input name="published" type="checkbox"> Publicado</label><button>Guardar</button> <button type="reset">Nuevo</button></form><div id="items"></div></section><script src="/android/admin/app.js" defer></script></html>
