<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        DATA SAO | Panel de Resultados
    </title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


<header class="header">

    <div class="logo">

        <img
            src="imagenes/logodata.png"
            alt="DATA SAO"
        >

    </div>

    <nav>

        <a href="index.html">
            Volver
        </a>

    </nav>

</header>



<main>


    <section class="hero">

        <p class="categoria">
            DATA SAO · ADMINISTRACIÓN
        </p>

        <h1>
            RESULTADOS
        </h1>

        <p class="descripcion">
            Panel privado de la votación.
        </p>

    </section>



    <!-- LOGIN -->

    <section
        id="loginResultados"
        class="login-resultados"
    >

        <h2>
            Acceso privado
        </h2>

        <p>
            Ingresá la contraseña de DATA SAO.
        </p>


        <input
            type="password"
            id="passwordResultados"
            placeholder="Contraseña"
        >


        <button
            onclick="ingresarResultados()"
        >
            INGRESAR
        </button>


        <p
            id="errorLogin"
            class="error-login"
        >
        </p>

    </section>



    <!-- RESULTADOS -->

    <section
        id="panelResultados"
        class="resultados-panel oculto"
    >


        <div class="resultados-encabezado">


            <div>

                <p class="categoria">
                    VOTACIÓN ACTUAL
                </p>

                <h2>
                    Talleres vs Ferro
                </h2>

            </div>


            <div class="total-votos">

                <span id="totalVotos">
                    0
                </span>

                <small>
                    VOTOS
                </small>

            </div>


        </div>


        <div
            id="listaResultados"
            class="lista-resultados"
        >

            <p class="cargando">
                Cargando resultados...
            </p>

        </div>


    </section>


</main>



<footer>

    <div class="logo">

        <img
            src="imagenes/logodata.png"
            alt="DATA SAO"
        >

    </div>

    <p>
        Panel privado DATA SAO
    </p>

</footer>



<script src="resultados.js"></script>


</body>

</html>
